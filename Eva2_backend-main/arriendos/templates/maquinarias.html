<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Maquinarias</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-primary text-center font-weight-bold">Catálogo de Maquinarias</h1>

        <!-- Formulario para agregar maquinaria -->
        <div class="card shadow-sm mb-5">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Agregar Nueva Maquinaria</h5>
            </div>
            <div class="card-body">
                <form id="formMaquinaria" class="row g-3">
                    <div class="col-md-4">
                        <label for="nombre" class="form-label">Nombre de la Maquinaria</label>
                        <input type="text" class="form-control" id="nombre" required placeholder="Ej: Excavadora CAT">
                    </div>
                    <div class="col-md-4">
                        <label for="categoria" class="form-label">Categoría</label>
                        <select class="form-select" id="categoria" required>
                            <option value="" selected disabled>Selecciona una categoría...</option>
                            {% for cat in categorias %}
                                <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="precio" class="form-label">Precio Diario ($)</label>
                        <input type="number" class="form-control" id="precio" step="0.01" required placeholder="Ej: 50000">
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-success px-4">Guardar Maquinaria</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Listado de Maquinarias -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">Listado de Maquinarias Disponibles</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col" class="ps-3">ID</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Categoría</th>
                                <th scope="col">Precio Diario</th>
                                <th scope="col" class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMaquinarias">
                            {% for maq in maquinarias %}
                            <tr id="fila-{{ maq.id }}">
                                <td class="ps-3">{{ maq.id }}</td>
                                <td class="fw-bold">{{ maq.nombre }}</td>
                                <td><span class="badge bg-info text-dark">{{ maq.categoria }}</span></td>
                                <td>${{ maq.precio_diario }}</td>
                                <td class="text-center">
                                    <button data-id="{{ maq.id }}" onclick="eliminarMaquinaria(this)" class="btn btn-danger btn-sm">Eliminar</button>
                                </td>
                            </tr>
                            {% empty %}
                            <tr id="filaVacia">
                                <td colspan="5" class="text-center py-4 text-muted">No hay maquinarias registradas.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript para interacción con la API -->
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Agregar maquinaria mediante POST a la API
        document.getElementById('formMaquinaria').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const categoriaId = document.getElementById('categoria').value;
            const precio = document.getElementById('precio').value;

            try {
                const response = await fetch('/api/maquinarias/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        categoria: parseInt(categoriaId),
                        precio_diario: precio
                    })
                });

                if (response.ok) {
                    location.reload();
                } else {
                    const errData = await response.json();
                    console.error('Error Backend:', errData);
                    alert('Error al guardar: ' + JSON.stringify(errData));
                }
            } catch (error) {
                console.error('Error:', error);
            }
        });

        // Eliminar maquinaria mediante DELETE a la API
        async function eliminarMaquinaria(boton) {
            const id = boton.getAttribute('data-id');
            if (!confirm('¿Estás seguro de borrar esta maquinaria?')) return;

            try {
                const response = await fetch(`/api/maquinarias/${id}/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });

                if (response.ok) {
                    const fila = document.getElementById(`fila-${id}`);
                    if (fila) fila.remove();
                } else {
                    alert('Error al eliminar la maquinaria.');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
